[package]
name = "rust-refactor"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
anyhow = "1.0"
camino = "1.1"
cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive"] }
ra_ap_ide = "=0.0.331"
ra_ap_load-cargo = "=0.0.331"
ra_ap_paths = "=0.0.331"
ra_ap_project_model = "=0.0.331"
ra_ap_syntax = "=0.0.331"
ra_ap_vfs = "=0.0.331"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
text-size = "1.1"
# ra-ap-rustc_lexer 0.160 checks that these crates use the same Unicode data.
unicode-ident = "=1.0.24"
unicode-properties = "=0.1.4"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.10"
